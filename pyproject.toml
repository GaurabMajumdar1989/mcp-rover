[project]
name = "mcp-rover"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Gaurab", email = "XXXX@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "black>=26.5.1",
    "isort>=8.0.1",
    "langchain>=1.3.16",
    "langchain-mcp-adapters>=0.3.2",
    "langchain-openai>=1.6.0",
    "langgraph>=1.2.11",
    "mcp>=1.29.0",
    "python-dotenv>=1.2.3",
]

[project.scripts]
mcp-rover = "mcp_rover.main:cli"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"
